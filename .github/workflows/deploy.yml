name: Deploy relay

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            TOKEN_SWITCH_A
            TOKEN_SWITCH_B
        env:
          TOKEN_SWITCH_A: ${{ secrets.TOKEN_SWITCH_A }}
          TOKEN_SWITCH_B: ${{ secrets.TOKEN_SWITCH_B }}
